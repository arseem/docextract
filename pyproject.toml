[project]
name = "docextract"
version = "0.1.0"
description = "Ekstrakcja ustrukturyzowanych danych z archiwum dokumentów przy pomocy lokalnego LLM"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pypdfium2>=4.30",
    "python-docx>=1.1",
    "selectolax>=0.3",
    "charset-normalizer>=3.3",
]

[project.scripts]
docextract = "docextract.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-socket>=0.7",
    "psutil>=6.0",
    "respx>=0.21",
    "fpdf2>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docextract"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: memory/performance tests, not run by default",
    "live: requires a real running LLM backend, not run by default",
]
addopts = "-m 'not slow and not live'"
